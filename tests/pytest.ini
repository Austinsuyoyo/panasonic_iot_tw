[pytest]
testpaths = unit standalone integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Unit tests that can run independently
    standalone: Standalone tests that don't require Home Assistant
    integration: Integration tests (may require setup)
    live_api: Live API tests that require real credentials (PANASONIC_ACCOUNT, PANASONIC_PASSWORD)
    device_test: Tests for device implementations
    property_test: Tests for device properties
    entity_test: Tests for entity creation
    asyncio: Async tests